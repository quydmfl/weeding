name: Deploy wedding invitation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build React site
        run: |
          npm install --no-audit --no-fund
          repository_name="${{ github.event.repository.name }}"
          base_path="/${repository_name}/"
          if [[ "$repository_name" == *.github.io ]]; then base_path="/"; fi
          BASE_PATH="$base_path" npm run build
          test -f dist/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show published website address
        run: |
          echo "## Thiệp mời đã được xuất bản" >> "$GITHUB_STEP_SUMMARY"
          echo "[Mở website](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
