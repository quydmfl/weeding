<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ed" />
    <title>Nguyên Sa & Minh Quý — Thiệp mời cưới</title>
  </head>
  <body>
    <div id="root">
      <main style="color:#23382f;font-family:Georgia,serif;padding:12vh 24px;text-align:center">
        <p style="color:#c8826f;font:600 10px Arial,sans-serif;letter-spacing:3px;text-transform:uppercase">Trân trọng kính mời</p>
        <h1 style="font-size:clamp(48px,10vw,96px);font-weight:400;margin:20px 0">Nguyên Sa &amp; Minh Quý</h1>
        <p id="loading-status">Thiệp mời đang được tải…</p>
      </main>
    </div>
    <script>
      window.setTimeout(() => {
        const status = document.getElementById('loading-status');
        if (status?.isConnected) {
          status.textContent = 'Không thể tải thiệp. Vui lòng kiểm tra GitHub Pages đang dùng nguồn “GitHub Actions”, không phải “Deploy from a branch”.';
        }
      }, 4000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
